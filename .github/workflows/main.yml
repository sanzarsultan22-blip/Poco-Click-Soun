
name: Build Android64 Geode Mod

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build for Android64
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: latest
          target: Android64

      - name: Upload mod
        uses: actions/upload-artifact@v4
        with:
          name: POCO-Click-Sounds-Android64
          path: ${{ steps.build.outputs.build-output }}
          
